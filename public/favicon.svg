<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>
  
  <g transform="translate(16, 0)">
    <!-- Africa Continent Outline (Dark Navy) -->
    <path d="M 180 60 
             C 210 50, 240 60, 260 60 
             C 280 80, 310 80, 320 90
             C 330 95, 345 105, 335 125
             C 345 130, 355 135, 345 145
             C 370 160, 385 190, 395 220
             C 405 250, 380 290, 360 320
             C 355 330, 345 355, 345 375
             C 335 390, 315 410, 295 420
             C 285 415, 275 385, 265 375
             C 255 355, 245 330, 240 305
             C 225 285, 205 280, 180 290
             C 160 295, 145 285, 140 260
             C 135 235, 140 215, 155 195
             C 145 175, 150 145, 170 125
             C 185 110, 170 85, 180 60 Z" 
          fill="none" stroke="#0e1b2e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Madagascar Island -->
    <path d="M 385 335 C 390 325, 395 345, 390 365 C 385 375, 380 360, 385 335 Z" 
          fill="none" stroke="#0e1b2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Green Network Connections inside Africa -->
    <line x1="200" y1="100" x2="185" y2="165" stroke="#10b981" stroke-width="4"/>
    <line x1="185" y1="165" x2="230" y2="150" stroke="#10b981" stroke-width="4"/>
    <line x1="185" y1="165" x2="160" y2="210" stroke="#10b981" stroke-width="4"/>
    <line x1="230" y1="150" x2="310" y2="145" stroke="#10b981" stroke-width="4"/>
    <line x1="310" y1="145" x2="330" y2="160" stroke="#10b981" stroke-width="4"/>
    <line x1="265" y1="360" x2="305" y2="375" stroke="#10b981" stroke-width="4"/>

    <!-- Network Nodes -->
    <circle cx="200" cy="100" r="7" fill="#10b981"/>
    <circle cx="185" cy="165" r="9" fill="#10b981"/>
    <circle cx="230" cy="150" r="7" fill="#10b981"/>
    <circle cx="310" cy="145" r="8" fill="#10b981"/>
    <circle cx="330" cy="160" r="6" fill="#10b981"/>
    <circle cx="265" cy="360" r="8" fill="#10b981"/>

    <!-- Orange Swoosh Orbit Arrow -->
    <path d="M 325 250 Q 360 170 365 75" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <polygon points="365,60 353,82 377,80" fill="#f59e0b"/>

    <!-- Large Central Green A with Arrow shape -->
    <!-- Left Leg of A -->
    <path d="M 245 140 L 175 340 L 225 340 L 245 280 L 265 280 L 245 140 Z" fill="#00a651"/>
    <!-- Central Arrow Crossbar -->
    <path d="M 245 140 L 225 340 L 260 215 L 295 340 L 345 340 L 245 140 Z" fill="#00a651"/>
    <!-- Dark Navy Overlay on Right Leg -->
    <path d="M 268 220 L 345 340 L 295 340 L 260 270 Z" fill="#0e1b2e"/>

    <!-- Brand Name Text: AfriNova -->
    <g transform="translate(0, 440)">
      <text x="240" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" fill="#0e1b2e" letter-spacing="-1">Afri</text>
      <text x="240" y="0" text-anchor="start" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" fill="#00a651" letter-spacing="-1">Nova</text>
    </g>

    <!-- Subtitle Text -->
    <g transform="translate(240, 480)">
      <circle cx="-165" cy="-6" r="5" fill="#f59e0b"/>
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#0e1b2e" letter-spacing="3">GLOBAL TECHNOLOGY MARKETPLACE</text>
      <circle cx="165" cy="-6" r="5" fill="#f59e0b"/>
    </g>
  </g>
</svg>
