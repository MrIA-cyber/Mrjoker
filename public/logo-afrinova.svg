<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="afriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Tech Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Indigo Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Mask Canvas (PWA standard squircle compatible) -->
  <rect width="512" height="512" rx="112" fill="url(#afriBg)" />

  <!-- Outer Ring Accent -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-opacity="0.35" />

  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Stylized Futuristic 'A' for AfriNova -->
    <!-- Left Leg -->
    <path d="M 150 400 L 236 130 C 242 110, 270 110, 276 130 L 362 400 H 304 L 280 320 H 232 L 208 400 Z" fill="#ffffff" />
    
    <!-- Inner Crossbar & Globe/Star Accent -->
    <path d="M 240 270 H 272 L 256 215 Z" fill="url(#afriBg)" />

    <!-- Nova Star Burst / Innovation Diamond at top -->
    <path d="M 256 120 L 268 145 L 293 157 L 268 169 L 256 194 L 244 169 L 219 157 L 244 145 Z" fill="url(#goldGrad)" />

    <!-- Dynamic Curved Orbit / Connecting Network Line -->
    <path d="M 120 330 C 180 390, 330 390, 392 330" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Connection Nodes -->
    <circle cx="120" cy="330" r="14" fill="#34d399" />
    <circle cx="392" cy="330" r="14" fill="#fbbf24" />
    <circle cx="256" cy="365" r="10" fill="#ffffff" />
  </g>
</svg>
